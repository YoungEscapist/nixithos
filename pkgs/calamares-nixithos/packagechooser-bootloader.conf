# The boot loader (boot.loader.*).  On a computer that boots through BIOS
# (not UEFI) it is GRUB whatever is chosen here.
mode: required

method: legacy

id: bootloader

labels:
    step: "Bootloader"

default: systemd-boot

items:
    - id: systemd-boot
      packages: [ systemd-boot ]
      name: systemd-boot
      description: "<html><b>systemd-boot</b>: a simple menu of the system's generations on the EFI partition. (The only piece of systemd NixithOS installs: its bootctl.)<br/>
                    <br/>
                    UEFI only; on BIOS, GRUB is installed.</html>"
      screenshot: "images/boot-systemd-boot.jpg"

    - id: limine
      packages: [ limine ]
      name: Limine
      description: "<html><b>Limine</b>: a small, fast boot loader with a menu of the generations; it can also start other systems' loaders.<br/>
                    <br/>
                    UEFI only here; on BIOS, GRUB is installed.</html>"
      screenshot: "images/boot-limine.jpg"

    - id: grub
      packages: [ grub2 ]
      name: GRUB
      description: "<html><b>GRUB</b>: the most widespread one; finds the other systems on the disks (os-prober) and puts them in its menu.</html>"
      screenshot: "images/boot-grub.jpg"

    - id: refind
      packages: [ refind ]
      name: rEFInd
      description: "<html><b>rEFInd</b>: a menu that finds the systems on the disks by itself (graphical with a theme, plain text as installed).<br/>
                    <br/>
                    UEFI only; on BIOS, GRUB is installed.</html>"
      screenshot: "images/boot-refind.jpg"
