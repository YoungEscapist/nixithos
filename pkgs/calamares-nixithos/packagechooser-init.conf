# The init system (nixithos.init).
mode: required

method: legacy

id: init

labels:
    step: "Init system"

default: s6

items:
    - id: s6
      packages: [ s6 ]
      name: s6
      description: "<html><b>s6</b>: s6-linux-init as PID 1 and s6-rc running the services. What NixithOS was built on, and the most tested; each service has a supervisor and a logger of its own.</html>"

    - id: dinit
      packages: [ dinit ]
      name: dinit
      description: "<html><b>dinit</b>: one small program as PID 1 and service manager, which knows what a service requires from what it only comes after, as systemd does.<br/>
                    <br/>
                    The same units, systemctl and logs as with s6. It can be changed later: nixithos.init in /etc/nixith/configuration.nix, and a reboot.</html>"
