# What to log in through: nixithos.desktop.displayManager.  (Nothing of it
# is written for "No desktop".)
mode: required

method: legacy

id: displaymanager

labels:
    step: "Login"

default: ly

items:
    - id: ly
      packages: [ ly ]
      name: ly
      description: "<html><b>ly</b>, a display manager in the console: the user, the password and the session (any desktop that is installed) on one screen, with an animation behind them.</html>"
      screenshot: "images/dm-ly.jpg"

    - id: greetd
      packages: [ greetd ]
      name: greetd
      description: "<html><b>greetd</b> with <b>tuigreet</b>: a plain text greeter that remembers the last user and session.</html>"
      screenshot: "images/dm-greetd.jpg"

    - id: none
      packages: []
      name: None (console login)
      description: "<html>No display manager: you log in on the console and start the session yourself (dwl starts by itself when you log in on tty1).</html>"
      screenshot: "images/dm-none.jpg"
