# NixithOS's desktops (nixithos.desktop.<id>), or none.  (The next steps:
# packagechooser-displaymanager.conf, -shell.conf, -bootloader.conf.)
mode: required

method: legacy

labels:
    step: "Desktop"

default: parallax

items:
    - id: parallax
      packages: [ parallax ]
      name: Parallax
      description: "<html><b>Parallax</b>: a Wayland compositor where the windows live on one infinite canvas and the screen is a camera looking at it. Desks, an overview, a wallpaper-coloured theme, its own bar and tray.</html>"
      screenshot: "images/parallax.jpg"

    - id: gnome
      packages: [ gnome-shell ]
      name: GNOME
      description: "<html><b>GNOME</b>, the session and its settings, with Files, Console, Text Editor and System Monitor (the other GNOME apps can be added later).</html>"
      screenshot: "images/gnome.jpg"

    - id: plasma
      packages: [ plasma-workspace ]
      name: KDE Plasma
      description: "<html><b>KDE Plasma 6</b> with its usual applications: Dolphin, Konsole, Kate, Spectacle...</html>"
      screenshot: "images/plasma6.jpg"

    - id: hyprland
      packages: [ hyprland ]
      name: Hyprland
      description: "<html><b>Hyprland</b>, a dynamic tiling Wayland compositor with animations, with kitty as the terminal and wofi to start programs (Super+Q a terminal, Super+R the programs, Super+M leaves).</html>"
      screenshot: "images/hyprland.jpg"

    - id: niri
      packages: [ niri ]
      name: niri
      description: "<html><b>niri</b>, a scrollable-tiling Wayland compositor: windows in columns on an endless strip, with alacritty, fuzzel and waybar (Super+T a terminal, Super+D the programs, Super+Shift+/ the keys).</html>"
      screenshot: "images/niri.jpg"

    - id: dwl
      packages: [ dwl ]
      name: dwl
      description: "<html>A small one: <b>dwl</b>, a tiling Wayland compositor, with <b>foot</b> as the terminal, <b>fuzzel</b> to start programs, sound through PipeWire, Firefox and a set of everyday tools.<br/>
                    <br/>
                    Without a display manager it starts when you log in on tty1. Super+Shift+Enter opens a terminal, Super+P the list of programs, Super+Shift+Q goes back to the console.</html>"
      screenshot: "images/dwl.jpg"

    - id: ""
      packages: []
      name: No desktop
      description: "<html>No graphical session: a console system. A desktop can be added later in /etc/nixith/configuration.nix (nixithos.desktop.&lt;name&gt;.enable = true;) and `sudo nixith switch`.</html>"
      screenshot: "images/nodesktop.jpg"
