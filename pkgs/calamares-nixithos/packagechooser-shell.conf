# The user's shell (users.users.<name>.shell).
mode: required

method: legacy

id: shell

labels:
    step: "Shell"

default: bash

items:
    - id: bash
      packages: [ bash ]
      name: Bash
      description: "<html><b>Bash</b>, the usual shell of Linux and the one NixithOS's own scripts are written in.</html>"
      screenshot: "images/shell-bash.jpg"

    - id: zsh
      packages: [ zsh ]
      name: Zsh
      description: "<html><b>Zsh</b>: Bash-like, with better completion and a great many plugins and themes.</html>"
      screenshot: "images/shell-zsh.jpg"

    - id: fish
      packages: [ fish ]
      name: fish
      description: "<html><b>fish</b>, the friendly interactive shell: suggestions as you type, colours and completion out of the box. Not POSIX: scripts for sh are not fish's.</html>"
      screenshot: "images/shell-fish.jpg"

    - id: nushell
      packages: [ nushell ]
      name: Nushell
      description: "<html><b>Nushell</b>: commands pass tables and records rather than text. Not POSIX.</html>"
      screenshot: "images/shell-nushell.jpg"
